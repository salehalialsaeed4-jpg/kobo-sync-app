{% extends 'base.html' %}{% block body %}<h1>مراجعة البيانات قبل الدمج</h1><p>عدد الاستجابات ضمن النطاق: <b>{{row_count}}</b> | المحافظة: {{province}} | الفترة: {{date_from or 'كل التواريخ'}} إلى {{date_to or 'كل التواريخ'}}</p><section class="panel tablewrap">{{table|safe}}</section><form method="post" action="{{url_for('merge')}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button>اعتماد البيانات وإنشاء جدول الدمج</button><a class="button secondary" href="{{url_for('process')}}">العودة لتعديل النطاق</a></form>{% endblock %}
