{% extends 'base.html' %}{% block body %}<h1>تسجيل مرشح جديد</h1><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="formgrid"><div><label>الاسم الثلاثي</label><input name="full_name" placeholder="الاسم الثلاثي للمرشح" required></div><div><label>المحافظة</label><select name="province" required><option value="">اختر المحافظة</option>{% for p in provinces %}<option>{{p}}</option>{% endfor %}</select></div></div><button>إضافة المرشح</button></form></section><section class="panel"><h2>آخر المرشحين المسجلين</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>الاسم</th><th>المحافظة</th><th>تاريخ التسجيل</th></tr></thead><tbody>{% for c in candidates %}<tr><td>{{c.id}}</td><td>{{c.full_name}}</td><td>{{c.province}}</td><td>{{c.created_at}}</td></tr>{% else %}<tr><td colspan="4">لا يوجد مرشحون بعد.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
