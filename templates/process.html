{% extends 'base.html' %}{% block body %}<h1>تحديد نطاق المعالجة</h1><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>المحافظة</label><select name="province"><option value="all">جميع المحافظات</option>{% for p in provinces %}<option>{{p}}</option>{% endfor %}</select><div class="formgrid"><div><label>من تاريخ (end)</label><input type="date" name="date_from"></div><div><label>إلى تاريخ (end)</label><input type="date" name="date_to"></div></div><button>معالجة ودمج التقييمات</button></form></section><p class="muted">يعتمد اختيار أحدث تقييم مكرر على وقت الإرسال ثم تاريخ end، ويكون مفتاح الدمج: المرشح + المحافظة + المقيّم.</p>{% endblock %}
